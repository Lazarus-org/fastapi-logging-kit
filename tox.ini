[tox]
requires =
    tox>=4.65
env_list =
    py315-fastapi0120
    py{314, 313, 312, 311}-fastapi{0120, 0100}

[testenv]
description = Run the full test suite against the selected FastAPI/Python combination
package = editable
deps =
    fastapi0100: fastapi<0.110,>=0.100
    fastapi0100: httpx<0.28,>=0.27
    fastapi0120: fastapi<1.0,>=0.115
    fastapi0120: httpx<1.0,>=0.27
extras =
    sqlalchemy
commands =
    pytest --cov=fastapi_logging_kit --cov-report=html
dependency_groups =
    test

[testenv:bandit]
description = Run security checks
skip_install = true
commands =
    bandit -c pyproject.toml -r fastapi_logging_kit
dependency_groups =
    quality

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
commands =
    pre-commit run --all-files
dependency_groups =
    quality
