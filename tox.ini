[tox]
requires =
    tox>=4.2
env_list =
    py314-fastapi{0120, 0100}
    py313-fastapi{0120, 0100}
    py312-fastapi{0120, 0100}
    py311-fastapi{0120, 0100}
    py310-fastapi{0120, 0100}
    py39-fastapi{0100}

[testenv]
description = Run Pytest tests with multiple FastAPI versions
deps =
    httpx
    jinja2
    pytest
    pytest-asyncio<1.0
    pytest-cov
    typer
    fastapi0100: fastapi<0.110,>=0.100
    fastapi0120: fastapi<1.0,>=0.115
commands =
    pytest --cov=fastapi_logging_kit --cov-report=html
develop = True

[testenv:bandit]
description = Run security checks
skip_install = true
deps =
    bandit
commands =
    bandit -r fastapi_logging_kit

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
