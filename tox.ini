[tox]
requires =
    tox>=4.65
env_list =
    py{315, 314}-fastapi0120
    py{313, 312, 311}-fastapi{0120, 0100}

[testenv]
description = Run the full test suite against the selected FastAPI/Python combination
package = editable
deps =
    fastapi0100: anyio<4.15,>=4.14
    fastapi0100: fastapi<0.110,>=0.100
    fastapi0100: httpx<0.27,>=0.26
    fastapi0100: pytest<9.2,>=9.1
    fastapi0120: fastapi<1,>=0.162
    fastapi0120: starlette<2,>=1.10
extras =
    sqlalchemy
set_env =
    COVERAGE_FILE = {env_dir}/.coverage
commands =
    pytest --cov=fastapi_logging_kit --cov-report=html:{env_dir}/htmlcov
dependency_groups =
    test

[testenv:bandit]
description = Run security checks
skip_install = true
commands =
    bandit -c pyproject.toml -r fastapi_logging_kit
dependency_groups =
    quality

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
commands =
    pre-commit run --all-files
dependency_groups =
    quality
