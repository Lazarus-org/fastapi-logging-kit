[tox]
requires =
    tox>=4.65,<5
env_list =
    py{311,312,313,314}-fastapi{0100,0120}
    py315-fastapi0120

[testenv]
description = Run the full test suite against the selected FastAPI/Python combination
package = editable
extras = sqlalchemy
deps =
    pytest>=9.1,<10
    pytest-asyncio>=1.4.1,<2.0
    pytest-cov>=7.1,<8
    fastapi0100: fastapi>=0.100,<0.110
    fastapi0100: httpx>=0.27,<0.28
    fastapi0120: fastapi>=0.115,<1.0
    fastapi0120: httpx>=0.27,<1.0
commands =
    pytest --cov=fastapi_logging_kit --cov-report=html

[testenv:bandit]
description = Run security checks
skip_install = true
deps =
    bandit[toml]>=1.9.4,<2
commands =
    bandit -c pyproject.toml -r fastapi_logging_kit

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files
