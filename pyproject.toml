[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.2,<3" ]

[project]
name = "fastapi-logging-kit"
version = "1.0.0"
description = "Extensible structured logging, request diagnostics, and observability utilities for FastAPI and ASGI applications"
readme = "README.md"
keywords = [
  "asgi",
  "fastapi",
  "fastapi logging",
  "observability",
  "request logging",
  "starlette",
  "structured logging"
]
license = "MIT"
license-files = [ "LICENCE" ]
authors = [
  { name = "ARYAN-NIKNEZHAD", email = "aryan513966@gmail.com" },
  { name = "MEHRSHAD-MIRSHEKARY", email = "mehrshad_mirshekary@email.com" },
]
requires-python = ">=3.11,<3.16"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Logging",
]
dependencies = [
  "anyio>=3.4,<5",
  "fastapi>=0.100,<1",
  "jinja2>=3.1,<4",
  "starlette>=0.27,<1",
  "typer>=0.12,<1",
]
optional-dependencies.sqlalchemy = [ "sqlalchemy>=2.0.52,<3" ]
urls."Source Code" = "https://github.com/lazarus-org/fastapi-logging-kit"
urls.Changelog = "https://github.com/lazarus-org/fastapi-logging-kit/blob/main/CHANGELOG.md"
urls.Documentation = "https://fastapi-logging-kit.readthedocs.io"
urls.Issues = "https://github.com/lazarus-org/fastapi-logging-kit/issues"
scripts.fastapi-logging-kit = "fastapi_logging_kit.commands.cli:main"

[tool.poetry]
packages = [
  { include = "fastapi_logging_kit" },
]
include = [
  { path = "AUTHORS.md", format = "sdist" },
  { path = "CODE_OF_CONDUCT.md", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "CONTRIBUTORS.md", format = "sdist" },
  { path = "SECURITY.md", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "docs/*.rst", format = "sdist" },
  { path = "docs/*.py", format = "sdist" },
  { path = "docs/requirements.txt", format = "sdist" },
  { path = "docs/Makefile", format = "sdist" },
  { path = "docs/make.bat", format = "sdist" },
  { path = "fastapi_logging_kit/py.typed", format = [ "sdist", "wheel" ] },
  { path = "fastapi_logging_kit/static", format = [ "sdist", "wheel" ] },
  { path = "fastapi_logging_kit/templates", format = [ "sdist", "wheel" ] },
  { path = "fastapi_logging_kit/tests", format = "sdist" },
  { path = "packages", format = "sdist" },
  { path = "scripts", format = "sdist" },
  { path = "tox.ini", format = "sdist" },
  { path = ".readthedocs.yaml", format = "sdist" },
]
exclude = [
  "fastapi_logging_kit/tests/**",
]
group.dev.dependencies.bandit = { extras = [ "toml" ], version = ">=1.9.4,<2" }
group.dev.dependencies.black = ">=26.5.1,<27"
group.dev.dependencies.codecov = "^2.1.13"
group.dev.dependencies.commitizen = ">=4.16.3,<5"
group.dev.dependencies.docformatter = ">=1.7.8,<2"
group.dev.dependencies.httpx = ">=0.27,<1"
group.dev.dependencies.isort = ">=5.13.2,<6"
group.dev.dependencies.mypy = ">=1.11.1,<2"
group.dev.dependencies.pre-commit = ">=4.4,<5"
group.dev.dependencies.pylint = ">=3.2.6,<4"
group.dev.dependencies.pytest = ">=9.1,<10"
group.dev.dependencies.pytest-asyncio = ">=1.4.1,<2"
group.dev.dependencies.pytest-cov = ">=7.1,<8"
group.dev.dependencies.python-semantic-release = "^9.8.8"
group.dev.dependencies.sphinx = ">=8.2,<10"
group.dev.dependencies.sphinx-rtd-theme = ">=3.1,<4"
group.dev.dependencies.sqlalchemy = ">=2.0.52,<3.0"
group.dev.dependencies.tox = ">=4.65,<5"

[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | venv
  | env
  | __pycache__
  | node_modules
  | \.mypy_cache
  | \.pytest_cache
  | .*\.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [
  "*.egg-info",
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "env",
  "node_modules",
  "venv",
]

[tool.pylint]
argument-rgx = "[a-z_][a-z0-9_]{2,30}$"
attr-rgx = "[a-z_][a-z0-9_]{2,30}$"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
const-rgx = "([A-Z_][A-Z0-9_]*)|(__.*__)"
disable = [
  "C0103", # Invalid constant name
  "C0114", # Missing module docstring
  "C0115", # Missing class docstring
  "C0116", # Missing function or method docstring
  "C0301", # Line too long
  "C0411", # Wrong import order
  "C0415",
  "E1101", # Instance of 'Foo' has no 'bar' member
  "R0401",
  "R0801", # Duplicate code
  "R0903", # Too few public methods
  "R0914",
  "R1705", # Unnecessary "elif" after "return"
  "R1719", # The if expression can be replaced with 'bool(test)'
  "W0212", # Access to a protected member
  "W0611", # Unused imports
  "W0613", # Unused arguments
  "W0621",
  "W0622", # Redefining built-in names
]
function-rgx = "[a-z_][a-z0-9_]{2,30}$"
ignore = [
  "*.egg-info/*",
  ".git/*",
  ".mypy_cache/*",
  ".pytest_cache/*",
  ".tox/*",
  "__pycache__/*",
  "build/*",
  "dist/*",
  "tests",
  "venv/*",
]
load-plugins = [
  "pylint.extensions.docparams",
]
max-args = 8
max-line-length = 88
max-positional-arguments = 8
method-rgx = "[a-z_][a-z0-9_]{2,30}$"
module-rgx = "(([a-z_][a-z0-9_]*)|(__.*__))$"
suggestion-mode = true
variable-rgx = "[a-z_][a-z0-9_]{2,30}$"

[tool.bandit]
exclude_dirs = [
  "*/tests/*",
  '*\tests\*',
]

[tool.mypy]
exclude = [
  "^build/",
  "^dist/",
  '^docs/conf\.py$',
  "^fastapi_logging_kit/tests/",
]
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true

[tool.pytest]
ini_options.python_files = [ "test_*.py", "tests.py" ]
ini_options.addopts = "--cov --cov-report=term-missing --cov-report=html --cov-fail-under=100"
ini_options.markers = [
  "base_formatter: Tests for the base class of formatters.",
  "base_middleware: Tests for the base class of middleware components.",
  "colored_formatter: Tests for a formatter that adds color coding to log messages.",
  "commands: Tests for CLI commands in the logging package.",
  "commands_archive_logs: Tests for the command that archives and compresses rotated log files.",
  "commands_generate_pretty_json: Tests for the command that generates pretty-formatted JSON logs.",
  "commands_generate_pretty_xml: Tests for the command that generates pretty-formatted XML logs.",
  "commands_logs_size_audit: Tests for the command that audits log sizes to ensure they don't exceed defined limits.",
  "commands_rotate_logs: Tests for the command that manually triggers log rotation.",
  "commands_send_logs: Tests focused on the `send-logs` CLI command.",
  "config_validator: Tests focused on validators that check configuration settings.",
  "contextvar: Tests for context variable handling in the logging package.",
  "contextvar_manager: Tests for managing context variables across different log contexts.",
  "decorators: Tests focused on custom decorators used throughout the package.",
  "decorators_execution_tracking: Tests specifically for the execution_tracking module.",
  "email_handler: Tests for the handler responsible for sending logs via email.",
  "email_settings_validator: Tests for validators that ensure email settings are valid.",
  "filters: Tests that verify log filtering mechanisms.",
  "filters_level_filter: Tests for filtering logs based on their severity level.",
  "flat_formatter: Tests for the formatter that creates flat log formats.",
  "formatters: Tests for log formatters that structure log messages.",
  "handlers: Tests for components that dispatch log messages to their destinations.",
  "handlers_rotating: Tests for the compressed rotating file handlers.",
  "integration: Tests for the FastAPI application integration entry points.",
  "json_formatter: Tests for the formatter that structures logs as JSON objects.",
  "middleware: Tests related to middleware components in logging.",
  "monitor_log_size_middleware: Tests for middleware that monitors the size of log files.",
  "request_middleware: Tests for middleware handling incoming HTTP requests in logging.",
  "routers: Tests for the API routers in the fastapi_logging_kit package.",
  "routers_log_iboard: Tests specially for the log_iboard router.",
  "settings: Tests that ensure logging settings are correctly applied.",
  "settings_checks: Tests for validating the correctness of logging settings.",
  "settings_conf: Tests for verifying the configuration of logging settings.",
  "settings_manager: Tests for the settings manager that resolves configuration.",
  "settings_rotation_checks: Tests for validating LOG_ROTATION and LOG_ROTATION_OVERRIDES settings.",
  "settings_rotation_conf: Tests for rotation-aware LogConfig and LogManager behaviour.",
  "utils: Tests for utility functions supporting the logging package.",
  "utils_context_manager: Tests for context managers handling resources in logging.",
  "utils_email_notifier: Tests for utilities that send notifications via email.",
  "utils_get_conf: Tests for utility functions that retrieve configuration settings.",
  "utils_log_and_notify: Tests for logging utilities that trigger notifications.",
  "utils_process_file: Tests for utility functions that process files.",
  "utils_set_conf: Tests for utility functions that set configuration settings.",
  "validators: Tests for validating configurations and inputs in the logging package.",
  "validators_rotation: Tests for validators that check rotation configuration inputs.",
  "xml_formatter: Tests for the formatter that structures logs as XML documents.",
]
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.omit = [
  "*/tests/*",
]
run.source = [ "fastapi_logging_kit" ]
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if 0:",
  "if self\\.debug",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise AssertionError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
settings.increment_types = [ "feat", "fix" ]

[tool.semantic_release]
tag_format = "v{version}"
major_on_zero = true
allow_zero_version = true
build_command_env = []
no_git_verify = false
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_author.default = "semantic-release <semantic-release>"
commit_author.env = "GIT_COMMIT_AUTHOR"
logging_use_named_masks = false
commit_parser = "emoji"
commit_parser_options.allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
]
commit_parser_options.default_bump_level = 0
commit_parser_options.minor_tags = [ "feat" ]
commit_parser_options.parse_emoji = true
commit_parser_options.patch_tags = [ "fix", "perf" ]
branches.main.match = "(main|master)"
branches.main.prerelease = false
branches.main.prerelease_token = "rc"
publish.dist_glob_patterns = [ "dist/*" ]
publish.upload_to_vcs_release = true
changelog.changelog_file = "CHANGELOG.md"
changelog.environment.autoescape = true
changelog.environment.block_end_string = "%}"
changelog.environment.block_start_string = "{%"
changelog.environment.comment_end_string = "#}"
changelog.environment.comment_start_string = "{#"
changelog.environment.extensions = []
changelog.environment.keep_trailing_newline = false
changelog.environment.lstrip_blocks = false
changelog.environment.newline_sequence = "\n"
changelog.environment.trim_blocks = false
changelog.environment.variable_end_string = "}}"
changelog.environment.variable_start_string = "{{"
changelog.exclude_commit_patterns = []
changelog.template_dir = "templates"
remote.ignore_token_for_push = false
remote.insecure = false
remote.name = "origin"
remote.token = ""
remote.type = "github"
