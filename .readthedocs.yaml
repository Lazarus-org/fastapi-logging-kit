# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install "poetry>=2.2,<3"
      # Read the Docs does not activate its virtualenv for Poetry automatically.
      - VIRTUAL_ENV="$READTHEDOCS_VIRTUALENV_PATH" poetry install --only main,docs --no-interaction
      - python -m sphinx --version

# Build documentation with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#   - pdf
#   - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
# Dependencies are installed directly from pyproject.toml and poetry.lock.
