name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.tox-env }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            tox-env: py311-fastapi0100
          - python-version: "3.11"
            tox-env: py311-fastapi0120
          - python-version: "3.12"
            tox-env: py312-fastapi0100
          - python-version: "3.12"
            tox-env: py312-fastapi0120
          - python-version: "3.13"
            tox-env: py313-fastapi0100
          - python-version: "3.13"
            tox-env: py313-fastapi0120
          - python-version: "3.14"
            tox-env: py314-fastapi0100
          - python-version: "3.14"
            tox-env: py314-fastapi0120
          - python-version: "3.15"
            tox-env: py315-fastapi0120

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            poetry.lock
            tox.ini

      - name: Install Poetry and test runner
        run: |
          python -m pip install "poetry>=2.2,<3"
          poetry check --lock
          poetry install --only main,quality --no-root --no-interaction

      - name: Run compatibility environment
        run: poetry run tox -e "${{ matrix.tox-env }}"

  quality:
    name: Static and browser-side security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Poetry and quality tools
        run: |
          python -m pip install "poetry>=2.2,<3"
          poetry check --lock
          poetry install --only main,quality --extras sqlalchemy --no-interaction

      - name: Run repository hooks
        run: poetry run pre-commit run --all-files --config=.pre-commit-config-ci.yaml

      - name: Check managed dependencies
        run: poetry check --lock

      - name: Run static type checks
        run: poetry run mypy fastapi_logging_kit

      - name: Run Pylint
        run: poetry run pylint -rn -sn --rcfile=pyproject.toml fastapi_logging_kit

      - name: Run LogiBoard security regressions
        run: node --test fastapi_logging_kit/tests/js/logiboard-security.test.mjs

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Poetry and build tools
        run: |
          python -m pip install "poetry>=2.2,<3"
          poetry check --lock
          poetry install --only main,build,docs --extras sqlalchemy --no-interaction

      - name: Build wheel and source distribution
        run: poetry build

      - name: Validate distribution metadata
        run: poetry run twine check dist/*

      - name: Inspect wheel and source distribution contents
        run: poetry run python scripts/verify_distributions.py dist

      - name: Install wheel with SQLAlchemy extra
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          distribution_name="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          echo "FASTAPI_LOGGING_DISTRIBUTION_NAME=${distribution_name}" >> "$GITHUB_ENV"
          python -m pip install "${wheel}[sqlalchemy]"

      - name: Smoke-test installed package and CLI
        run: |
          cd /tmp
          python - "$FASTAPI_LOGGING_DISTRIBUTION_NAME" <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          import sys

          import fastapi_logging_kit
          import sqlalchemy

          package = files("fastapi_logging_kit")
          assert fastapi_logging_kit.__version__ == version(sys.argv[1])
          assert package.joinpath("py.typed").is_file()
          assert package.joinpath("templates/log_iboard.html").is_file()
          assert package.joinpath("static/LogiBoard/js/scripts.js").is_file()
          assert sqlalchemy.__version__
          print("Installed wheel smoke test passed.")
          PY
          fastapi-logging-kit --help

      - name: Verify documentation dependencies
        run: poetry check --lock

      - name: Build documentation without warnings
        run: poetry run sphinx-build -W --keep-going -b html docs /tmp/fastapi-logging-kit-docs

      - name: Upload distributions for inspection
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-logging-kit-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
