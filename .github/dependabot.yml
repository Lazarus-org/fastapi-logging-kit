version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Update resolved releases without unnecessarily raising supported minimums.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10
